# Nginx Reverse Proxy Configuration for InsAcc Enterprise Server [To Be Implemented]
# File: /etc/nginx/sites-available/insacc.conf

# Rate Limiting Zone: Prevents brute-force login attempts (10 requests/minute per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

# HTTP Server Block: Redirects all unencrypted HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name erp.insacc.com;

    # Permanent 301 Redirect to TLS/SSL
    return 301 https://$host$request_uri;
}

# HTTPS Server Block: Primary Enterprise SSL Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.insacc.com;

    # SSL Certificate & Private Key Paths (Let's Encrypt / Enterprise CA)
    ssl_certificate /etc/letsencrypt/live/erp.insacc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.insacc.com/privkey.pem;

    # SSL Security Hardening (TLS 1.2 and TLS 1.3 Only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Access and Error Log Paths
    access_log /var/log/nginx/insacc_access.log;
    error_log /var/log/nginx/insacc_error.log warn;

    # Reverse Proxy Location for Node.js REST API Backend
    location /api/v1/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        # Header Forwarding Standards
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (60 seconds)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
