# PostgreSQL Host-Based Authentication Rules for InsAcc ERP [To Be Implemented]
# File: /etc/postgresql/17/main/pg_hba.conf
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local unix domain socket connections (Database Admin)
local   all             postgres                                peer

# Local IPv4 loopback connections
host    all             all             127.0.0.1/32            scram-sha-256

# Local IPv6 loopback connections
host    all             all             ::1/128                 scram-sha-256

# InsAcc Enterprise Server SSL Connections (Enforces TLS encryption)
hostssl insacc_db       insacc_user     10.0.0.0/8              scram-sha-256
hostssl insacc_db       insacc_user     172.16.0.0/12           scram-sha-256
hostssl insacc_db       insacc_user     192.168.1.0/24          scram-sha-256

# Replication Connections (Streaming Replication Slave Nodes)
hostssl replication     replicator      10.0.0.0/8              scram-sha-256
