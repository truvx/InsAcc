# PostgreSQL 17 Production Tuning Configuration for InsAcc ERP [To Be Implemented]
# File: /etc/postgresql/17/main/postgresql.conf

# Connections and Networking
listen_addresses = '*'          # Listen on all network interfaces
port = 5432                     # Standard PostgreSQL TCP port
max_connections = 200           # Maximum client connection limit
superuser_reserved_connections = 3

# Memory Tuning (Optimized for 16GB Dedicated RAM Server)
shared_buffers = 4GB            # 25% of total system memory
effective_cache_size = 12GB     # 75% of total system memory
work_mem = 32MB                 # Memory for query sort operations per process
maintenance_work_mem = 1GB      # Memory for VACUUM, CREATE INDEX, and ALTER TABLE

# Write-Ahead Log (WAL) and Replication
wal_level = replica             # Enables streaming replication and point-in-time recovery
max_wal_size = 16GB             # Maximum WAL size before automatic checkpoint
min_wal_size = 2GB              # Minimum WAL retention size
checkpoint_completion_target = 0.9 # Spreads checkpoint I/O over 90% of checkpoint interval
checkpoint_timeout = 15min      # Maximum time between automatic WAL checkpoints

# Query Planner & Cost Tuning
random_page_cost = 1.1          # Optimized for SSD / NVMe drives
effective_io_concurrency = 200  # Number of concurrent disk I/O operations for SSDs

# Logging Configuration
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Log queries taking longer than 250ms (slow query audit)
log_line_prefix = '%m [%p] %q%u@%d '

# Locale and Regional Formatting
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
